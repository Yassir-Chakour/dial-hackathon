services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wolf_materials
      POSTGRES_USER: wolf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wolf -d wolf_materials"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - wolf-private

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: production
      APP_NAME: wolf-materials-backend
      LOG_LEVEL: INFO
      API_HOST: 0.0.0.0
      API_PORT: 8000
      ALLOW_EXTERNAL_BIND: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8084}
      DATABASE_URL: postgresql+psycopg://wolf:${POSTGRES_PASSWORD}@postgres:5432/wolf_materials
      SOURCE_STORAGE_MODE: object_storage
      OBJECT_STORAGE_DIR: /app/data/objects
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    volumes:
      - backend-data:/app/data
    networks:
      - wolf-public
      - wolf-private

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    environment:
      PORT: 8084
      HOSTNAME: 0.0.0.0
    depends_on:
      backend:
        condition: service_started
    expose:
      - "8084"
    networks:
      - wolf-public

volumes:
  postgres-data:
  backend-data:

networks:
  wolf-private:
    internal: true
  wolf-public:
